<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLEXBLOX</title>

    <style>
        * {font-family: Arial, Helvetica, sans-serif;}

        #conteiner {display: flex;
            flex-flow: row wrap;
            background-color: aqua;
            height: 250px;
            margin-bottom: 10px;}

        .item {flex: auto;
            text-align: center;
            background-color: blue;
            color: white;
            font-weight: bold;
            padding: 5px;
            border: 1px solid white;}

        #i1 {align-self: flex-end;}
        #i2 {align-self: center;}
        #i3 {align-content: center;}


        #cont2 {display: flex;
        flex-flow: row wrap;
        background-color: aquamarine;
        height: 200px;
        align-items: center;}

        .itemm {flex-basis: 140px;
            flex-grow: 0;
            background-color: blueviolet;
            color: white;
            font-weight: bold;
            border: 1px solid white;
            font-size: 20px;
            padding: 5px;}

        #um {flex-grow: 1;}
        #dois {flex-grow: 3;}
    </style>
</head>

<body>
    <div id="conteiner">
        <div class="item" id="i2">A BLABLA</div>
        <div class="item" id="i3">B BLABLA</div>
        <div class="item" id="i1">C BLABLA</div>
        <div class="item">D BLABLA</div>
        <div class="item">E BLABLA</div>
        <div class="item">F BLABLA</div>
    </div>

    <div id="cont2">
        <div class="itemm" id="um">QUALQUER 1</div>
        <div class="itemm" id="dois">QUALQUER 2</div>
        <div class="itemm" id="tres">QUALQUER 3</div>
        <div class="itemm">QUALQUER 4</div>
        <div class="itemm">QUALQUER 5</div>
        <div class="itemm">QUALQUER 6</div>
    </div>
</body>
</html>
