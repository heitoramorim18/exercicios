<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLEXBLOX</title>

    <style>
        * {font-family: Arial, Helvetica, sans-serif;}

        #conteiner {display: flex;
            flex-flow: row wrap;
            background-color: aqua;
            height: 400px;}

        .item {flex: auto;
            text-align: center;
            background-color: blue;
            color: white;
            font-weight: bold;
            padding: 5px;
            border: 1px solid white;}

        #i1 {align-self: flex-end;}
        #i2 {align-self: center;}
        #i3 {align-content: center;}
    </style>
</head>

<body>
    <div id="conteiner">
        <div class="item" id="i2">A BLABLA</div>
        <div class="item" id="i3">B BLABLA</div>
        <div class="item" id="i1">C BLABLA</div>
        <div class="item">D BLABLA</div>
        <div class="item">E BLABLA</div>
        <div class="item">F BLABLA</div>
    </div>
</body>
</html>
