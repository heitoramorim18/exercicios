<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMULÁRIOS 2</title>

    <style>
        form {min-width: 300px; max-width: 600px; margin: auto;}
        body {background-color: rgb(250, 134, 134); font-family: Arial, Helvetica, sans-serif;}

        fieldset {background-color: rgb(138, 64, 64); color: white; font-weight: bold; box-shadow: 1px 2px 3px rgba(0, 0, 0, 0.733);}
    </style>
</head>
<body>
    <form action="cadastro.php" method="get">
        <fieldset>
            <legend>ESPORTES FAVORITOS</legend>
            <input type="checkbox" name="iesfut" id="futebol">
            <label for="futebol">Futebol</label> <br>

            <input type="checkbox" name="iesbas" id="basquete">
            <label for="basquete">Basquete</label> <br>

            <input type="checkbox" name="iesvol" id="volei"> 
            <label for="volei">Vôlei</label> <br>
        </fieldset>

        <fieldset>
            <legend>SEXO</legend>
            <input type="radio" name="rad1" id="irad1" required> 
            <label for="irad1">Feminino</label> <br>

            <input type="radio" name="rad1" id="irad2" required checked> 
            <label for="irad2">Masculino</label> <br>

            <input type="radio" name="rad1" id="irad3" required> 
            <label for="irad3">Outro</label> <br> 
        </fieldset>

        <fieldset>
            <legend>OUTROS INPUTS</legend>

            <label for="">Escolher cor:</label>
            <input type="color" name="cor" id="icor" value="#ff00ff"> <br>

            <label for="">Barra de escolher:</label>
            <input type="range" name="rang" id="irang" min="1" max="4" value="1"> <br>

            <label for="isel">ESTADOS</label>
            <select name="sel" id="isel">  
                <optgroup label="Região Sudeste">
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="SP">São Paulo</option>
                    <option value="PE">Minas Gerais</option>
                </optgroup>

                <optgroup label="Região Nordeste">
                    <option value="PE">Pernambuco</option>
                    <option value="MA">Maranhão</option>
                    <option value="BH">Bahia</option> 
                </optgroup>
            </select> <br>

            <label for="ilist">DATALIST</label>
            <input type="text" name="lis" id="ilist" list="idata">

            <datalist id="idata">
                <option value="DEV">Desenvolvedor</option>
                <option value="COZ">Cozinheiro</option>
                <option value="CONT">Contabilista</option>
            </datalist> <br> <br>

            <label for="inum1">Número 1</label>
            <input type="number" name="num1" id="inum1" oninput="isoma.innerHTML = Number(inum1.value) + Number(inum2.value)">

            <label for="inum2">Número 2</label>
            <input type="number" name="num2" id="inum2" oninput="isoma.innerHTML = Number(inum1.value) + Number(inum2.value)">

            <label for="isoma">Soma:</label>
            <output name="soma" id="isoma">0</output>  

            <textarea name="text" id="itext" cols="74" rows="8" max="30"></textarea>
            <output id="said"></output>
        </fieldset>

        <input type="submit">
    </form>
</body>
</html>
