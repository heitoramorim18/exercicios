<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABELAS</title>

    <style>
        body {font-family: Arial, Helvetica, sans-serif;}

        table {border-collapse: collapse; width: 400px; margin: auto; margin-top: 150px; box-shadow: 1px 3px 4px rgba(0, 0, 0, 0.644);}

        tbody tr:nth-child(2n) {background-color: rgb(206, 206, 206);}

        td, th {border: 2px solid black; padding: 8px;}
        
        td {font-weight: bolder;}

        th {background-color: rgb(148, 148, 148);}

        .number {text-align: right;}

        tfoot tr td {text-align: center; background-color: rgb(148, 148, 148);}

        caption {font-weight: bolder; padding: 5px; background-color: rgb(196, 196, 196); border: 1px solid black;}
    </style>
</head>

<body>
    <table>
        <caption>ESTADOS FEDERATIVOS DO BRASIL</caption>
        <thead>
            <tr>
                <th>Estados</th>
                <th>Qualquer coisa</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>São Paulo</td>
                <td class="number">55.122.321</td>
            </tr>

            <tr>
                <td>Pernambuco</td>
                <td class="number">12.214.000</td>
            </tr>

            <tr>
                <td>Amapá</td>
                <td class="number">9.321.230</td>
            </tr>

            <tr>
                <td>Rio Grande do Sul</td>
                <td class="number">5.000.210</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th>TOTAL</th>
                <td>90.000.231</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
